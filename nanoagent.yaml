_ > nanoagent.plugin.v0001.ManifestConfig:
id: triage-root-cause
name: Triage Root Cause
version: 0.1.3
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  generate_outage:
    description: Write a seeded microservice dependency graph with one failing service and its alerts to <destination>/outage-<seed>-<services>.json, and list every service's name
  list_alerts:
    description: List every alerting service in an outage file with its alert time, earliest first
  inspect_service:
    description: Show one service's direct dependencies, direct dependents and alert time
  inspect_services:
    description: Show the direct dependencies, direct dependents and alert time of up to 80 services in one call

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  generate-outage:
    description: Generate a seeded outage
    runner: tool
    tools: [generate_outage]
    reference: null
    instructions: Write the outage for the seed and service count into the destination folder and return its path, service count, alerting count and SHA-256.
  list-alerts:
    description: List an outage's alerts
    runner: tool
    tools: [list_alerts]
    reference: null
    instructions: Read the outage file and return every alerting service with its alert time, sorted by alert time, then name.
  inspect-service:
    description: Inspect one service of an outage
    runner: tool
    tools: [inspect_service]
    reference: null
    instructions: Read the outage file and return the service's sorted direct dependencies, its sorted direct dependents and its alert time, empty when it is not alerting.
  find-root-cause:
    description: Find the service whose failure explains an outage's alerts
    runner: agent
    tools: [generate_outage, list_alerts, inspect_services]
    reference: null
    instructions: |-
      Generate the outage for the seed and service count with generate_outage, destination outages.
      Call list_alerts on that file to see which services are alerting. Most alerts are symptoms: a service alerts when something it depends on fails.
      generate_outage returns every service's name, but not how they connect. Call inspect_services once on that file with all of the names to get every service's depends_on and dependents. You may call list_alerts and inspect_services in the same turn. Make each of these three calls once: you have only a few turns, so never inspect services one at a time.
      Apply this rule: a candidate root is an alerting service none of whose transitive dependencies alerts. Its blast radius is the number of alerting services that transitively depend on it. The root cause is the candidate with the largest blast radius; ties go to the earlier alert, then the name.
      The earliest alert is not always the root cause.
      Your last action must be one call to submit: the file as generate_outage returned it, root_cause, blast_radius as the root cause's blast radius, and other_candidates as every other candidate root, sorted by name (an empty list when there is none). Never end with a text reply instead of submit.
